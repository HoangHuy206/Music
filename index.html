<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="AuraMusic - Nền tảng nghe nhạc trực tuyến thế hệ mới với âm thanh chất lượng cao, gợi ý SoundCloud thông minh và lời bài hát đồng bộ 60FPS." />
    <meta property="og:title" content="AuraMusic • Next-Gen AI Web Audio Player" />
    <meta property="og:description" content="Thưởng thức âm nhạc chất lượng cao với gợi ý SoundCloud AI thông minh, lời bài hát Karaoke 60FPS và kho bài hát tải lên." />
    <meta property="og:type" content="website" />
    <title>AuraMusic • Next-Gen AI Web Audio Player</title>
    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Lexend:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5 CSS Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Cloudflare Turnstile Official Verification API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('[SW Register Warning]:', err);
          });
        });
      }
    </script>
    <style>
      :root {
        --font-main: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: 'Lexend', 'Be Vietnam Pro', -apple-system, sans-serif;
        --bg-dark: #08090d;
        --bg-card: rgba(18, 22, 34, 0.7);
        --bg-card-hover: rgba(28, 34, 52, 0.85);
        --border-glass: rgba(255, 255, 255, 0.08);
        --border-glass-bright: rgba(255, 255, 255, 0.18);
        --accent-cyan: #00f2fe;
        --accent-purple: #9d4edd;
        --accent-pink: #ff2a85;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        background-color: var(--bg-dark);
        font-family: var(--font-main);
        color: #f1f5f9;
        overflow-x: hidden;
        min-height: 100vh;
        selection-background-color: #00f2fe33;
      }

      ::selection {
        background: rgba(0, 242, 254, 0.35);
        color: #ffffff;
      }

      /* Custom Cyber Slim Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(11, 14, 20, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 999px;
        transition: background 0.2s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 242, 254, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
